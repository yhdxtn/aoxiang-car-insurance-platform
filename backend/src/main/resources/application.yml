server:
  port: ${PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 12MB
spring:
  application:
    name: taikang-mini-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/taikang_mini?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:taikang_mini}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
app:
  mode: live
  encryption-key: ${DATA_ENCRYPTION_KEY:}
  upload-dir: ${UPLOAD_DIR:./data/private-files}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  token-hours: ${TOKEN_HOURS:12}
  wechat-appid: ${WX_APP_ID:}
  wechat-secret: ${WX_APP_SECRET:}
  tk-gateway-url: ${TK_GATEWAY_URL:}
  tk-gateway-token: ${TK_GATEWAY_TOKEN:}
  tk-account-label: ${TK_ACCOUNT_LABEL:未配置}
  tk-timeout-seconds: ${TK_TIMEOUT_SECONDS:210}
logging:
  level:
    root: INFO
    org.springframework.jdbc: WARN
